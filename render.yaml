# Paid plans create billable Render resources only when you approve the Blueprint.
services:
  - type: web
    name: farmtouch-app
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: FARMTOUCH_RUNTIME
        value: node
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: farmtouch-db
          property: connectionString
      - key: ADMIN_SETUP_CODE
        generateValue: true
      - key: WHATSAPP_STORE_NUMBER
        sync: false
      - key: SHOP_URL
        sync: false

databases:
  - name: farmtouch-db
    plan: 0.1c-256mb
    region: singapore
    ipAllowList: []
    databaseName: farmtouch
    user: farmtouch
